    <circle cx="47" cy="13" r="4" fill="#0f172a"/>
    <circle cx="47" cy="32" r="4" fill="#0f172a"/>
    <circle cx="47" cy="51" r="4" fill="#0f172a"/>
  </g>
  <text x="240" y="170" font-family="Segoe UI, Inter, sans-serif" font-size="56" font-weight="700" fill="#f8fafc">Open Multiroute DEX Bot</text>
  <text x="242" y="215" font-family="Segoe UI, Inter, sans-serif" font-size="24" fill="#94a3b8">Route TradingView alerts to multiple DEXes — dYdX v4 · GMX v2 · Hyperliquid · Bluefin · Perpetual</text>
