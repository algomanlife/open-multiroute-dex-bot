<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Open Multiroute DEX Bot dashboard mockup">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="#020617"/>
  <!-- top nav -->
  <rect x="0" y="0" width="1200" height="48" fill="#0f172a"/>
  <rect x="20" y="14" width="20" height="20" rx="5" fill="url(#line)"/>
  <text x="48" y="29" font-family="Segoe UI, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">Open Multiroute DEX Bot</text>
  <rect x="1010" y="14" width="110" height="20" rx="10" fill="#1e293b"/>
  <text x="1022" y="28" font-family="Segoe UI, sans-serif" font-size="10" fill="#94a3b8">0x1a2b…9c4d</text>
  <rect x="930" y="14" width="70" height="20" rx="6" fill="#22d3ee"/>
  <text x="940" y="28" font-family="Segoe UI, sans-serif" font-size="10" fill="#020617" font-weight="600">Connected</text>
  <!-- sidebar -->
  <rect x="0" y="48" width="180" height="652" fill="#020617"/>
  <g font-family="Segoe UI, sans-serif" font-size="12" fill="#64748b">
