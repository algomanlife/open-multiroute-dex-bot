  <rect x="720" y="170" width="468" height="240" rx="12" fill="#0f172a" stroke="#1e293b"/>
  <text x="736" y="196" font-family="Segoe UI, sans-serif" font-size="11" fill="#94a3b8">Recent Alerts</text>
  <g font-family="Segoe UI, sans-serif" font-size="11">
    <rect x="736" y="210" width="436" height="34" rx="6" fill="#020617"/>
    <text x="748" y="232" fill="#e2e8f0">hyperliquid · ETH · buy 0.1</text>
    <circle cx="1156" cy="227" r="5" fill="#34d399"/>
    <rect x="736" y="252" width="436" height="34" rx="6" fill="#020617"/>
    <text x="748" y="274" fill="#e2e8f0">gmx · BTC_USD · sell 0.05</text>
    <circle cx="1156" cy="269" r="5" fill="#34d399"/>
    <rect x="736" y="294" width="436" height="34" rx="6" fill="#020617"/>
    <text x="748" y="316" fill="#e2e8f0">dydxv4 · BTC-USD · buy 0.2</text>
    <circle cx="1156" cy="311" r="5" fill="#f87171"/>
    <rect x="736" y="336" width="436" height="34" rx="6" fill="#020617"/>
