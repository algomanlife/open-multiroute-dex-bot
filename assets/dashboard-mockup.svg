    <rect x="500" y="498" width="44" height="16" rx="8" fill="#052e2b"/><text x="508" y="510" fill="#34d399">LONG</text>
    <text x="600" y="510" fill="#e2e8f0">1.25</text><text x="720" y="510" fill="#e2e8f0">3,012.40</text><text x="880" y="510" fill="#94a3b8">momentum-v2</text>
    <text x="216" y="540" fill="#e2e8f0">gmx</text><text x="360" y="540" fill="#e2e8f0">BTC_USD</text>
    <rect x="500" y="528" width="52" height="16" rx="8" fill="#2b0a12"/><text x="508" y="540" fill="#f87171">SHORT</text>
    <text x="600" y="540" fill="#e2e8f0">0.40</text><text x="720" y="540" fill="#e2e8f0">67,540.00</text><text x="880" y="540" fill="#94a3b8">mean-revert</text>
    <text x="216" y="570" fill="#e2e8f0">dydxv4</text><text x="360" y="570" fill="#e2e8f0">ETH-USD</text>
    <rect x="500" y="558" width="44" height="16" rx="8" fill="#052e2b"/><text x="508" y="570" fill="#34d399">LONG</text>
    <text x="600" y="570" fill="#e2e8f0">2.00</text><text x="720" y="570" fill="#e2e8f0">3,098.10</text><text x="880" y="570" fill="#94a3b8">breakout</text>
  </g>
