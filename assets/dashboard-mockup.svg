    <text x="216" y="94" font-size="11" fill="#94a3b8">Total Trades</text>
    <text x="216" y="126" font-size="22" fill="#f8fafc" font-weight="700">128</text>
    <rect x="451" y="70" width="235" height="80" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="467" y="94" font-size="11" fill="#94a3b8">Win Rate</text>
    <text x="467" y="126" font-size="22" fill="#f8fafc" font-weight="700">61.7%</text>
    <rect x="702" y="70" width="235" height="80" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="718" y="94" font-size="11" fill="#94a3b8">Total P&amp;L</text>
    <text x="718" y="126" font-size="22" fill="#34d399" font-weight="700">+$4,213.80</text>
    <rect x="953" y="70" width="235" height="80" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="969" y="94" font-size="11" fill="#94a3b8">Open Positions</text>
    <text x="969" y="126" font-size="22" fill="#f8fafc" font-weight="700">6</text>
  </g>
  <!-- chart -->
  <rect x="200" y="170" width="500" height="240" rx="12" fill="#0f172a" stroke="#1e293b"/>
  <text x="216" y="196" font-family="Segoe UI, sans-serif" font-size="11" fill="#94a3b8">Cumulative P&amp;L</text>
  <path d="M216 380 L280 360 L340 372 L400 330 L460 344 L520 290 L580 305 L640 262 L684 240"
