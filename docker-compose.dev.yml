# Development stack: postgres only. Run api/web with pnpm dev (hot reload).

name: omdb-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: omdb
      POSTGRES_PASSWORD: omdb
      POSTGRES_DB: omdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omdb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata_dev:
