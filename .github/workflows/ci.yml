name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @omdb/api db:generate

      - name: Build packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (core)
        run: pnpm --filter @omdb/core test:coverage

      - name: Unit tests (api)
        run: pnpm --filter @omdb/api test

      - name: Coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            packages/core/coverage
            apps/api/coverage
          retention-days: 7

  integration:
    name: API integration (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: omdb
          POSTGRES_PASSWORD: omdb
          POSTGRES_DB: omdb_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U omdb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://omdb:omdb@localhost:5432/omdb_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @omdb/api db:generate
      - run: pnpm build
      - name: Apply migrations
        run: pnpm --filter @omdb/api db:migrate
      - name: Boot API and probe healthz
        run: |
          node apps/api/dist/index.js &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/healthz && break || sleep 1
          done
          curl -sf http://127.0.0.1:3000/healthz

  docker:
    name: Docker build (api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          tags: omdb-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: false
          tags: omdb-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
